<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a">
        <animate attributeName="stop-color" values="#0f172a;#030712;#0f172a" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#1e1b4b">
        <animate attributeName="stop-color" values="#1e1b4b;#1e293b;#1e1b4b" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#090d16">
        <animate attributeName="stop-color" values="#090d16;#020617;#090d16" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Glowing Text Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1">
        <animate attributeName="stop-color" values="#6366f1;#38bdf8;#a855f7;#6366f1" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#ec4899">
        <animate attributeName="stop-color" values="#ec4899;#6366f1;#06b6d4;#ec4899" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#06b6d4">
        <animate attributeName="stop-color" values="#06b6d4;#ec4899;#38bdf8;#06b6d4" dur="6s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4338ca" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.8"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes float {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
      100% { transform: translateY(0px); }
    }
    .title {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 900;
      font-size: 48px;
      letter-spacing: -1px;
    }
    .subtitle {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 20px;
      fill: #94a3b8;
    }
    .tag {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #e2e8f0;
    }
    .floating-box {
      animation: float 4s ease-in-out infinite;
    }
  </style>

  <!-- Background -->
  <rect width="1200" height="400" rx="16" fill="url(#bgGrad)" />
  <rect x="2" y="2" width="1196" height="396" rx="15" fill="none" stroke="url(#borderGrad)" stroke-width="2" />

  <!-- Ambient Light Orbs -->
  <circle cx="200" cy="100" r="140" fill="#6366f1" opacity="0.15" filter="url(#glow)">
    <animate attributeName="cx" values="200;300;200" dur="10s" repeatCount="indefinite" />
  </circle>
  <circle cx="1000" cy="300" r="160" fill="#06b6d4" opacity="0.15" filter="url(#glow)">
    <animate attributeName="cy" values="300;200;300" dur="8s" repeatCount="indefinite" />
  </circle>
  <circle cx="950" cy="120" r="100" fill="#a855f7" opacity="0.18" filter="url(#glow)">
    <animate attributeName="r" values="100;130;100" dur="6s" repeatCount="indefinite" />
  </circle>

  <!-- Main Content Box -->
  <g transform="translate(80, 0)">
    <!-- Badge Header -->
    <g transform="translate(0, 75)">
      <rect width="270" height="32" rx="16" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5" />
      <circle cx="16" cy="16" r="6" fill="#22c55e">
        <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="32" y="21" class="tag" fill="#a5b4fc">SOURCE-TO-PAY &amp; PROCURE-TO-PAY</text>
    </g>

    <!-- Title -->
    <text x="0" y="165" class="title" fill="url(#accentGrad)" filter="url(#glow)">Awesome Procurement Software</text>
    <text x="0" y="165" class="title" fill="url(#accentGrad)">Awesome Procurement Software</text>

    <!-- Subtitle -->
    <text x="0" y="210" class="subtitle">Curated SaaS Platforms, Open-Source Repositories &amp; Spend Control Ecosystems</text>

    <!-- Pill Highlights -->
    <g transform="translate(0, 260)">
      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect width="170" height="42" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
        <text x="18" y="26" class="tag">💼 Strategic Sourcing</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(185, 0)">
        <rect width="180" height="42" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
        <text x="18" y="26" class="tag">📦 Purchase Orders / RFQ</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(380, 0)">
        <rect width="180" height="42" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
        <text x="18" y="26" class="tag">🤝 Supplier Management</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(575, 0)">
        <rect width="170" height="42" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
        <text x="18" y="26" class="tag">📊 Spend Analytics</text>
      </g>
      <!-- Pill 5 -->
      <g transform="translate(760, 0)">
        <rect width="190" height="42" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
        <text x="18" y="26" class="tag">⚡ Open Source &amp; SaaS</text>
      </g>
    </g>

    <!-- Footer Stats / Live Indicator -->
    <g transform="translate(0, 335)">
      <text x="0" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#64748b">
        ⭐ Actively Maintained • Category Leaders • Global Standards (OCDS) • Enterprise &amp; Self-Hosted
      </text>
    </g>
  </g>

  <!-- Dynamic Procurement Graphic on Right Side -->
  <g transform="translate(1030, 160)" class="floating-box">
    <!-- Center Hexagon / Hub -->
    <polygon points="0,-45 39,-22 39,22 0,45 -39,22 -39,-22" fill="#1e1b4b" stroke="#818cf8" stroke-width="2.5" />
    <text x="0" y="6" text-anchor="middle" font-size="22" fill="#38bdf8">🛒</text>
    
    <!-- Rotating Node Ring -->
    <circle cx="0" cy="0" r="70" fill="none" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="6,6" opacity="0.7">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="15s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
